# Electron Builder Configuration

appId: com.infinitecanvas1.app
productName: Infinite Canvas
executableName: Infinite Canvas
copyright: Copyright © 2024 wangxk

directories:
  buildResources: build
  output: dist-electron

files:
  - out/**/*

extraResources:
  - from: resources/api
    to: resources/api
  - from: resources/web
    to: resources/web
  - from: resources/env.ini
    to: resources/env.ini

asar: true
# asarUnpack removed: api and web are already placed via extraResources,
# no need to also extract them from the asar archive

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Utility
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  perMachine: false

dmg:
  title: ${productName} ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
